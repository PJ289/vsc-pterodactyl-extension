name: Release Extension

on:
  release:
    types: [published]

jobs:
  build:
    name: Build and Release Extension
    # Package on Windows so native ssh2 modules match Cursor/VS Code on Windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Package Extension
        run: npm run package

      - name: Verify VSIX package
        shell: pwsh
        run: |
          $vsix = Get-ChildItem -Path . -Filter *.vsix | Select-Object -First 1
          if (-not $vsix) {
            throw "ERROR: No VSIX file found."
          }

          Write-Host "VSIX file: $($vsix.Name)"
          Write-Host "VSIX size: $($vsix.Length) bytes"

          # Broken packages without node_modules are ~180 KB; expect several MB on Windows
          $minSize = 2000000
          if ($vsix.Length -lt $minSize) {
            throw "ERROR: VSIX too small ($($vsix.Length) bytes). Dependencies may be missing."
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($vsix.FullName)
          try {
            $entries = $zip.Entries.FullName

            if (-not ($entries | Select-String -SimpleMatch "extension/node_modules/ssh2/")) {
              throw "ERROR: missing node_modules/ssh2"
            }
            if (-not ($entries | Select-String -SimpleMatch "extension/node_modules/ws/")) {
              throw "ERROR: missing node_modules/ws"
            }
            if (-not ($entries | Select-String -SimpleMatch "extension/out/extension.js")) {
              throw "ERROR: missing compiled output"
            }
          } finally {
            $zip.Dispose()
          }

          Write-Host "VSIX verification passed."

      - name: Extract Changelog
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          sed -n "/^## \\[${VERSION}\\]/,/^## /{/^## /b;p}" CHANGELOG.md > ./RELEASE_CHANGELOG

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          body_path: ./RELEASE_CHANGELOG
          files: "*.vsix"
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
