name: Release Extension

on:
  release:
    types: [published]

jobs:
  build:
    name: Build and Release Extension
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Package Extension
        run: npx @vscode/vsce package

      - name: Verify VSIX contains runtime dependencies
        run: |
          unzip -l *.vsix | grep -q "node_modules/ssh2/" || (echo "ERROR: VSIX is missing node_modules/ssh2. Do not use --no-dependencies." && exit 1)
          unzip -l *.vsix | grep -q "extension/out/extension.js" || (echo "ERROR: VSIX is missing compiled output." && exit 1)

      - name: Extract Changelog
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          sed -n "/^## \\[${VERSION}\\]/,/^## /{/^## /b;p}" CHANGELOG.md > ./RELEASE_CHANGELOG

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          body_path: ./RELEASE_CHANGELOG
          files: "*.vsix"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
